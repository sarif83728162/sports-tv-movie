<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্পোর্টস টিভি মুভি</title>
    <!-- ভিডিও প্লেয়ারের জন্য প্রয়োজনীয় ফাইল -->
    <link href="https://zencdn.net" rel="stylesheet" />
    <style>
        body { font-family: Arial, sans-serif; background-color: #141414; color: white; text-align: center; padding: 15px; margin: 0; }
        .header { font-size: 24px; font-weight: bold; color: #ff9900; margin: 15px 0; }
        .coin-box { background-color: #222; border: 2px solid #ff9900; padding: 10px 20px; border-radius: 10px; display: inline-block; margin-bottom: 20px; }
        .coin-amount { font-size: 28px; color: #00ffcc; font-weight: bold; }
        .player-container { width: 100%; max-width: 600px; margin: 0 auto 20px auto; background: #000; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .info-text { font-size: 14px; margin: 5px 0; color: #bbb; }
    </style>
</head>
<body>

    <div class="header">স্পোর্টস টিভি মুভি</div>

    <!-- কয়েন সেকশন -->
    <div class="coin-box">
        <div>আপনার মোট কয়েন</div>
        <div class="coin-amount" id="userCoins">১০০</div>
        <div class="info-text">(সাইন আপ বোনাস ১০০ কয়েন)</div>
    </div>

    <!-- লাইভ টিভি প্লেয়ার সেকশন -->
    <div class="player-container">
        <video id="live-player" class="video-js vjs-default-skin vjs-16-9 vjs-big-play-centered" controls preload="auto" data-setup='{}'>
            <!-- টেস্ট লাইভ টিভি স্ট্রিম লিঙ্ক -->
            <source src="https://unified-streaming.com" type="application/x-mpegURL">
            আপনার ব্রাউজারটি লাইভ টিভি সাপোর্ট করে না।
        </video>
    </div>

    <div class="info-text">🎁 প্রতি রেফারে পাবেন আরও ১০০ কয়েন!</div>

    <!-- ভিডিও প্লেয়ার স্ক্রিপ্ট -->
    <script src="https://zencdn.net"></script>
</body>
</html>
