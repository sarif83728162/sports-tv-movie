<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্পোর্টস টিভি মুভি</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #141414; color: white; text-align: center; padding: 20px; }
        .header { font-size: 24px; font-weight: bold; color: #ff9900; margin-bottom: 20px; }
        .coin-box { background-color: #222; border: 2px solid #ff9900; padding: 15px; border-radius: 10px; display: inline-block; margin-bottom: 30px; }
        .coin-amount { font-size: 32px; color: #00ffcc; font-weight: bold; }
        .info-text { font-size: 16px; margin: 10px 0; color: #bbb; }
    </style>
</head>
<body>

    <div class="header">স্পোর্টস টিভি মুভি</div>

    <div class="coin-box">
        <div>আপনার মোট কয়েন</div>
        <div class="coin-amount" id="userCoins">১০০</div>
        <div class="info-text">(সাইন আপ বোনাস ১০০ কয়েন যোগ করা হয়েছে)</div>
    </div>

    <div class="info-text">🎁 প্রতি রেফারে পাবেন আরও ১০০ কয়েন!</div>

</body>
</html>
